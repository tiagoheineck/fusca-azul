<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="all.css">
  <title>Fusca Azul</title>
</head>

<body>
  <nav class="navbar navbar-expand bg-body-tertiary">
    <div class="container-fluid">
      <img src="img/fusca2.png" class="img">
      <a class="navbar-brand h1" href="#">Fusca Azul</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      </div>
    </div>
  </nav>

  <div class="hero">
    <div>
      <h1>Junte-se a nós e colecione Soquinhos!</h1>
      <p>Faça seu cadastro e participe para disputar no ranking de soquinhos e registrar Fuscas Azuis que encontrar</p>
    </div>

    <div class="container-login">
      <h2>Entrar</h2>

      <label for="">Nome de Usuário</label>
      <input type="text" placeholder="Digite seu nome de usuário">

      <label for="">E-mail</label>
      <input type="email" placeholder="Digite seu e-mail">

      <label for="">Senha</label>
      <input type="password" placeholder="Digite sua senha">


      <button>Entrar</button>

      <p>Não possui conta? Crie uma aqui <a href="criar-conta.html">Criar conta</a></p>
    </div>
  </div>

  <footer class="d-flex fixed-bottom bg-body-tertiary">
    <p class="p"><strong>Jogo - Fusca Azul <br> Projeto desenvolvido na <a href="https://fsw-ifc.brdrive.net/">Fábrica
          de software</a></strong></p>
  </footer>

</body>

</html>
