<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="inicio.css">
  <link rel="stylesheet" href="all.css">
  <title>Fusca Azul</title>
</head>

<body>
  <nav class="navbar navbar-expand bg-body-tertiary">
    <div class="container-fluid">
      <img src="img/fusca2.png" class="img">
      <a class="navbar-brand h1" href="#">Fusca Azul</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      </div>
    </div>
    </div>
  </nav>

  <aside id="menu" class="menu">
    <div class="menu-topo">
      <div class="logo">
        <img src="img/fusca2.png" alt="">
        <span>Fusca Azul</span>
      </div>

      <button class="btn" id="fecharMenu"><img src="img/excluir.png" alt=""></button>
    </div>

    <a href="inicio.html"><img src="img/casa.png"> Início</a>
    <a href="foto.html"><img src="img/camera.png"> Postar Foto</a>
    <a href="ranking.html"><img src="img/ranking.png"> Ranking</a>
    <a href="socar.html"><img src="img/soco.png">Soquinhos</a>
    <a href="denuncia.html"><img src="img/bandeiras.png"> Denunciar</a>
    <a href="contestar.html"><img src="img/balao-de-fala.png"> Contestar</a>
  </aside>

  <main class="content">
    <button class="menu-btn" onclick="toggleMenu()">
      <img src="img/menu-aberto.png">
    </button>

    <section class="topo">

      <div class="usuario">
        <h1>Olá, João!</h1>
      </div>

      <div class="top-right">
        <div class="soquinhos">
          <img src="img/soco.png">
          <div>
            <strong>2450</strong>
            <p>Soquinhos</p>
          </div>
        </div>

        <div class="notificacao">
          <img src="img/notificacao.png">
        </div>
        <img class="avatar" src="img/avatar.png">
      </div>
    </section>
  </main>

  <section class="banner">
    <div class="banner-texto">
      <p>Encontre um</p>
      <h2>Fusca Azul</h2>
      <p>No caminho, registre e ganhe soquinhos!</p>
      <button class="btn-foto">
        <img src="img/camera.png">
        Postar Foto
      </button>
    </div>
    <img src="img/teste.png" class="fusca-banner">
  </section>

  <section class="acoes">
    <div class="card-acao">
      <img src="img/camera.png">
      <a href="foto.html">Postar Foto</a>
    </div>

    <div class="card-acao">
      <img src="img/ranking.png">
      <a href="ranking.html">Ranking</a>
    </div>

    <div class="card-acao">
      <img src="img/soco.png">
      <a href="socar.html">Soquinhos</a>
    </div>

    <div class="card-acao">
      <img src="img/balao-de-fala.png">
      <a href="contestar.html">Contestar</a>
    </div>

    <div class="card-acao">
      <img src="img/bandeiras.png">
      <a href="denuncia.html">Denunciar</a>
    </div>
    </main>

    <script src="app.js">
    </script>


    <footer class="d-flex fixed-bottom bg-body-tertiary">
      <p class="p"><strong>Jogo - Fusca Azul <br> Projeto desenvolvido na <a href="https://fsw-ifc.brdrive.net/">Fábrica
            de software</a></strong></p>
    </footer>
</body>
