_format_version: "3.0"
_transform: true
services:
  - name: auth-api
    url: http://auth-api:3002
    routes:
      - name: auth-api-route
        paths:
          - /auth-api
        strip_path: true
        methods:
          - GET
          - POST
          - OPTIONS

  - name: health-api
    url: http://health-api:3000
    routes:
      - name: health-api-route
        paths:
          - /health-api
        strip_path: true
        methods:
          - GET
          - OPTIONS
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify:
            - exp

consumers:
  - username: fusca-app-client
    jwt_secrets:
      - key: fusca-app
        algorithm: HS256
        secret: change-me-in-production

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Length
      max_age: 3600